<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materialize Admin Console</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background-color: #0e0524;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      color: #f5b352;
      font-size: 2.2rem;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(245,179,82,0.6);
    }
    .card {
      background: #1a0d3a;
      padding: 30px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 25px rgba(245,179,82,0.3);
      border: 1px solid rgba(245,179,82,0.4);
      text-align: left;
    }
    .label { color:#f5b352; font-weight:600; }
    .value { color:#fff; margin-bottom:10px; word-break:break-all; }
    a.download-link {
      display:block; margin-top:16px; color:#f5b352;
      text-decoration:none; font-weight:600; text-align:center;
      transition:all .3s ease;
    }
    a.download-link:hover { text-decoration:underline; color:#ffcc66; }
    .btn {
      display:inline-block; background:#f5b352; color:#0e0524e0;
      border:none; padding:14px 36px; border-radius:30px;
      font-weight:600; font-size:18px; cursor:pointer;
      transition:all .3s ease; box-shadow:0 0 20px rgba(245,179,82,0.5);
      margin-top:20px; width:100%;
    }
    .btn:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(245,179,82,0.8); }
    .secondary { background:transparent; color:#f5b352; border:2px solid #f5b352; }
    .secondary:hover { background:#f5b352; color:#0e0524; }
  </style>
</head>

<body>
  <h1>🧾 Materialize Admin Console</h1>

  <div class="card">
    <p><span class="label">🕒 Time:</span> <span class="value" id="time">—</span></p>
    <p><span class="label">👛 Wallet:</span> <span class="value" id="wallet">—</span></p>
    <p><span class="label">🎨 NFT Name:</span> <span class="value" id="nft">—</span></p>

    <a href="https://drive.google.com/file/d/1hM_L47oT6nMWKYYtFoSQny5RGIJms4gx/"
       class="download-link" target="_blank">⬇️ Download G-Code File</a>

    <button class="btn" id="refreshBtn">🔄 Load Next Job</button>
    <button class="btn secondary" id="verifyBtn">✅ Mark as Produced / Verified</button>
  </div>

  <script>
    const refreshBtn = document.getElementById('refreshBtn');
    const verifyBtn = document.getElementById('verifyBtn');

    async function loadData() {
      refreshBtn.textContent = '⏳ Loading...';
      try {
        const res = await fetch('https://materialize.app.n8n.cloud/webhook/admin-next');
        const data = await res.json();
        const job = Array.isArray(data) ? data[0] : data;
        document.getElementById('time').textContent = job['Timestamp'] || 'N/A';
        document.getElementById('wallet').textContent = job['Wallet Address'] || 'N/A';
        document.getElementById('nft').textContent = job['NFT Name'] || 'N/A';
      } catch (err) {
        console.error(err);
        alert('⚠️ Error fetching job data');
      } finally {
        refreshBtn.textContent = '🔄 Load Next Job';
      }
    }

    async function verifyJob() {
      const wallet = document.getElementById('wallet').textContent;
      if (!wallet || wallet === 'N/A' || wallet === '—') {
        alert('⚠️ No wallet address loaded. Please load a job first.');
        return;
      }
      verifyBtn.textContent = '⏳ Sending...';
      verifyBtn.disabled = true;
      try {
        const res = await fetch('https://materialize.app.n8n.cloud/webhook/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet })
        });
        if (res.ok) alert(`Wallet ${wallet} sent for verification.`);
        else alert('❌ Error triggering verification webhook.');
      } catch (err) {
        console.error(err);
        alert('⚠️ Could not contact n8n webhook.');
      } finally {
        verifyBtn.textContent = '✅ Mark as Produced / Verified';
        verifyBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', loadData);
    verifyBtn.addEventListener('click', verifyJob);
    loadData();
  </script>
</body>
</html>
