<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materialize Admin Console</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background-color: #0e0524;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #f5b352;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(245, 179, 82, 0.6);
    }

    .card {
      background: #1a0d3a;
      padding: 30px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 25px rgba(245, 179, 82, 0.3);
      border: 1px solid rgba(245, 179, 82, 0.4);
      text-align: left;
    }

    .label {
      color: #f5b352;
      font-weight: bold;
    }

    .value {
      color: #fff;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      background: #f5b352;
      color: #0e0524e0;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(245, 179, 82, 0.5);
      margin-top: 20px;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(245, 179, 82, 0.8);
    }

    .secondary {
      background: transparent;
      border: 2px solid #f5b352;
      color: #f5b352;
      margin-top: 12px;
    }

    .secondary:hover {
      background: #f5b352;
      color: #0e0524e0;
    }

    a.download-link {
      display: inline-block;
      margin-top: 14px;
      color: #f5b352;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    a.download-link:hover {
      text-decoration: underline;
      color: #ffcc66;
    }
  </style>
</head>
<body>
  <h1>🧾 Materialize Admin Console</h1>

  <div class="card">
    <p><span class="label">🕒 Time:</span> <span class="value" id="time">—</span></p>
    <p><span class="label">👛 Wallet:</span> <span class="value" id="wallet">—</span></p>
    <p><span class="label">🎨 NFT Name:</span> <span class="value" id="nft">—</span></p>
    <p><span class="label">🧬 G-Code:</span> <span class="value">DEFAB2025</span></p>

    <a
      href="https://drive.google.com/file/d/your_gcode_file_id/view?usp=sharing"
      class="download-link"
      target="_blank"
    >
      ⬇️ Download G-Code File
    </a>

    <button class="btn" id="verifyBtn">✅ Mark as Produced / Verified</button>
    <button class="btn secondary" id="nextBtn">➡️ Load Next Job</button>
  </div>

  <script>
    const verifyBtn = document.getElementById("verifyBtn");
    const nextBtn = document.getElementById("nextBtn");

    async function loadNextJob() {
      nextBtn.textContent = "⏳ Loading...";
      try {
        const res = await fetch("https://materialize.app.n8n.cloud/webhook/https://drive.google.com/file/d/1hM_L47oT6nMWKYYtFoSQny5RGIJms4gx/view?usp=sharing/admin-next");
        const data = await res.json();

        const job = Array.isArray(data) ? data[0] : data;

        document.getElementById("time").textContent = job["Timestamp"] || "N/A";
        document.getElementById("wallet").textContent = job["Wallet Address"] || "N/A";
        document.getElementById("nft").textContent = job["NFT Name"] || "N/A";
      } catch (err) {
        alert("⚠️ Error fetching job data");
      } finally {
        nextBtn.textContent = "➡️ Load Next Job";
      }
    }
    // Auto-load first job
    loadNextJob();
  </script>
</body>
</html>
